<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vòng Quay Bốc Thăm Ghép Cặp</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            color: white;
            padding: 20px 15px 40px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            font-size: 2.2rem;
            color: #fde047;
            text-align: center;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #dbeafe;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .reset-btn {
            background: #ef4444;
            color: white;
            border: 2px solid #fca5a5;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin: 0 auto 30px auto;
            transition: transform 0.1s, background 0.2s;
        }

        .reset-btn:active {
            transform: scale(0.95);
            background: #dc2626;
        }

        .reset-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 35px;
        }

        @media (min-width: 768px) {
            .container { flex-direction: row; }
        }

        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2);
            flex: 1;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        @media (min-width: 768px) {
            .card {
                margin-bottom: 0;
                margin-right: 20px;
            }
            .card:last-child {
                margin-right: 0;
            }
        }

        .card-title {
            color: #fde047;
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
            font-size: 1.4rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .team-list {
            display: flex;
            flex-direction: column;
        }

        .team-btn {
            background: linear-gradient(to right, #2563eb, #1d4ed8);
            border: 1px solid #60a5fa;
            color: white;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            transition: transform 0.1s;
            margin-bottom: 12px;
        }
        
        .team-btn:last-child {
            margin-bottom: 0;
        }

        .team-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .team-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .empty-msg {
            text-align: center;
            color: #cbd5e1;
            font-style: italic;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Match Results */
        .match-card {
            background: rgba(255,255,255,0.15);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            text-align: center;
            border-left: 4px solid #facc15;
            display: flex;
            flex-direction: column;
            gap: 6px;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            animation: fadeIn 0.5s ease-out forwards;
        }

        @media (min-width: 400px) {
            .match-card { flex-direction: row; gap: 12px; }
        }

        .match-label { color: #fde047; font-weight: bold; font-size: 1.1rem; }
        .match-team { color: #dbeafe; font-weight: bold; font-size: 1.2rem; }
        .match-vs { 
            background: rgba(127,29,29,0.5); 
            color: #fca5a5; 
            font-size: 0.85rem; 
            font-weight: 900; 
            padding: 3px 8px; 
            border-radius: 6px; 
        }

        /* Wheel */
        .wheel-section {
            position: relative;
            margin-bottom: 40px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .wheel-container {
            position: relative;
            width: 90vw;
            max-width: 380px;
            height: 90vw;
            max-height: 380px;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), inset 0 0 0 10px #facc15;
            background-color: #fff;
            transition: opacity 0.5s;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: block;
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ef4444;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
            z-index: 10;
        }

        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 44px;
            height: 44px;
            background-color: #facc15;
            border: 4px solid #fff;
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .hidden { display: none !important; }

        .modal-content {
            background: white;
            padding: 30px 20px;
            border-radius: 24px;
            text-align: center;
            max-width: 340px;
            width: 100%;
            border: 4px solid #facc15;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .modal-title { color: #6b7280; font-size: 1.4rem; font-weight: bold; margin-bottom: 5px; }
        .modal-subtitle { color: #9ca3af; font-size: 0.95rem; margin-bottom: 25px; }
        .modal-winner {
            background: linear-gradient(45deg, #ef4444, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2rem;
            font-weight: 900;
            line-height: 1.3;
            margin-bottom: 30px;
        }
        
        .modal-vs { font-size: 1.1rem; color: #9ca3af; display: block; margin: 10px 0; -webkit-text-fill-color: initial; }
        .modal-team1 { font-size: 1.5rem; -webkit-text-fill-color: initial; color: #374151; display: block; }

        .modal-btn {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(37,99,235,0.3);
        }
        .modal-btn:active { background: #1d4ed8; transform: scale(0.98); }

    </style>
</head>
<body>

    <!-- Tiêu đề -->
    <h1 class="title">Bốc Thăm Ghép Cặp</h1>
    <p id="statusText" class="subtitle">Vui lòng chọn một đội để tìm đối thủ!</p>
    
    <button onclick="resetWheel()" class="reset-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
        </svg>
        Làm Mới Vòng Quay
    </button>

    <!-- Khu vực Chọn Đội -->
    <div class="container">
        <!-- Bảng A -->
        <div class="card">
            <h3 class="card-title">Các Đội Bảng A</h3>
            <div class="team-list" id="teamButtonsA"></div>
        </div>
        <!-- Bảng B -->
        <div class="card">
            <h3 class="card-title">Các Đội Bảng B</h3>
            <div class="team-list" id="teamButtonsB"></div>
        </div>
    </div>

    <!-- Khu vực Vòng Quay -->
    <div class="wheel-section" id="wheelSection">
        <div class="wheel-container">
            <div class="pointer" id="wheelPointer"></div>
            <canvas id="wheelCanvas"></canvas>
            <div class="center-dot" id="wheelCenter"></div>
        </div>
    </div>

    <!-- Khu vực Hiển thị Kết quả -->
    <div class="container">
        <!-- Kết quả Bảng A -->
        <div class="card">
            <h2 class="card-title">Kết Quả Bảng A</h2>
            <div class="team-list" id="scheduleA">
                <div class="empty-msg">Chưa có trận đấu nào</div>
            </div>
        </div>
        
        <!-- Kết quả Bảng B -->
        <div class="card">
            <h2 class="card-title">Kết Quả Bảng B</h2>
            <div class="team-list" id="scheduleB">
                <div class="empty-msg">Chưa có trận đấu nào</div>
            </div>
        </div>
    </div>

    <!-- Modal Kết Quả -->
    <div id="resultModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 class="modal-title">Đội được chọn</h2>
            <p id="matchContextText" class="modal-subtitle"></p>
            <div id="winnerText" class="modal-winner">
                Tên Trường
            </div>
            <button onclick="confirmSelection()" class="modal-btn">
                Tiếp tục
            </button>
        </div>
    </div>

    <script>
        // Bắt lỗi toàn cục để hiển thị lên màn hình điện thoại (nếu có lỗi trên iOS)
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            var st = document.getElementById('statusText');
            if (st) {
                st.innerHTML = '<span style="color:#fca5a5; font-size: 0.9rem;">Lỗi iOS: ' + msg + ' (Dòng ' + lineNo + ')</span>';
            }
            return false;
        };

        var groupMapping = {
            "Lê Văn Việt": "A",
            "Tân Phú": "A",
            "Phong Phú": "A",
            "Tăng Nhơn Phú": "B",
            "Trương Văn Thành": "B",
            "Đinh Tiên Hoàng": "B"
        };
        
        var groups = {
            "A": ["Lê Văn Việt", "Tân Phú", "Phong Phú"],
            "B": ["Tăng Nhơn Phú", "Trương Văn Thành", "Đinh Tiên Hoàng"]
        };
        
        var allTeams = groups["A"].concat(groups["B"]);
        
        var groupCycles = { "A": {}, "B": {} };
        function initCycles() {
            function generate(arr) {
                var shuffled = arr.slice();
                // Thuật toán xáo trộn Fisher-Yates an toàn tuyệt đối cho mọi trình duyệt iOS
                for (var i = shuffled.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var temp = shuffled[i];
                    shuffled[i] = shuffled[j];
                    shuffled[j] = temp;
                }
                var res = {};
                res[shuffled[0]] = shuffled[1];
                res[shuffled[1]] = shuffled[2];
                res[shuffled[2]] = shuffled[0];
                return res;
            }
            groupCycles["A"] = generate(groups["A"]);
            groupCycles["B"] = generate(groups["B"]);
        }
        initCycles();

        var matches = { "A": [], "B": [] };
        var spunTeams = []; 
        var currentSpinner = null;
        var selectedWinner = null;
        var wheelOptions = allTeams;

        var sliceColors = ["#ef4444", "#3b82f6", "#10b981", "#f59e0b", "#8b5cf6", "#ec4899"];
        
        var canvas = document.getElementById('wheelCanvas');
        var ctx = canvas ? canvas.getContext('2d') : null;
        
        function resizeCanvas() {
            if (!canvas) return;
            var size = canvas.parentElement.clientWidth || 300;
            if (size > 0) {
                canvas.width = size;
                canvas.height = size;
                drawWheel();
            }
        }
        
        window.addEventListener('resize', resizeCanvas);

        var currentAngle = 0; 
        var isSpinning = false;
        var animationFrameId;
        
        var startTime = null;
        var startAngle = 0;
        var targetAngle = 0;
        var SPIN_DURATION = 4000; 

        function drawWheel() {
            if (!canvas || !ctx) return;
            try {
                var size = canvas.parentElement.clientWidth || 300;
                if(size === 0) return;
                
                if (canvas.width !== size) {
                    canvas.width = size;
                    canvas.height = size;
                }

                var center = size / 2;
                var radius = Math.max(0, center - 10);
                var numSlices = wheelOptions.length;

                ctx.clearRect(0, 0, size, size);
                var sliceAngle = (2 * Math.PI) / numSlices;

                for (var i = 0; i < numSlices; i++) {
                    var angleStart = currentAngle + i * sliceAngle;
                    var angleEnd = angleStart + sliceAngle;

                    ctx.beginPath();
                    ctx.moveTo(center, center);
                    ctx.arc(center, center, radius, angleStart, angleEnd);
                    ctx.closePath();

                    ctx.fillStyle = sliceColors[i % sliceColors.length];
                    ctx.fill();
                    
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = "#ffffff";
                    ctx.stroke();

                    ctx.save();
                    ctx.translate(center, center);
                    ctx.rotate(angleStart + sliceAngle / 2);
                    
                    ctx.textAlign = "right";
                    ctx.fillStyle = "#ffffff";
                    // Tối giản font chữ để tránh lỗi render text trên iOS/Safari
                    ctx.font = "14px Arial";
                    
                    ctx.shadowColor = "rgba(0,0,0,0.5)";
                    ctx.shadowBlur = 4;
                    ctx.shadowOffsetX = 1;
                    ctx.shadowOffsetY = 1;

                    ctx.fillText(wheelOptions[i], radius - 20, 5);
                    ctx.restore();
                }
            } catch (error) {
                console.error("Lỗi vẽ vòng quay:", error);
            }
        }

        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        function animate(time) {
            if (!startTime) startTime = time;
            var elapsed = time - startTime;
            if (elapsed > SPIN_DURATION) elapsed = SPIN_DURATION;
            
            var progress = elapsed / SPIN_DURATION;
            var easeProgress = easeOutCubic(progress);
            
            currentAngle = startAngle + (targetAngle - startAngle) * easeProgress;
            drawWheel();
            
            if (elapsed < SPIN_DURATION) {
                animationFrameId = requestAnimationFrame(animate);
            } else {
                isSpinning = false;
                determineWinner();
            }
        }

        function startSpinForTeam(team) {
            if (isSpinning) return;
            currentSpinner = team;
            selectedWinner = groupCycles[groupMapping[team]][team];
            
            var winnerIndex = wheelOptions.indexOf(selectedWinner);
            var numSlices = wheelOptions.length;
            var sliceAngle = (2 * Math.PI) / numSlices;
            
            var targetMod = (3 * Math.PI / 2) - (winnerIndex * sliceAngle + sliceAngle / 2);
            var normalizedTargetMod = (targetMod + 2 * Math.PI) % (2 * Math.PI);
            
            startAngle = currentAngle;
            var tempTarget = startAngle + (2 * Math.PI * 6);
            var currentMod = tempTarget % (2 * Math.PI);
            var diff = normalizedTargetMod - currentMod;
            if (diff < 0) diff += 2 * Math.PI;
            
            targetAngle = tempTarget + diff;
            
            document.getElementById('statusText').innerHTML = "Đang bốc thăm đối thủ cho <b style='color:#fde047'>" + team + "</b>...";
            
            isSpinning = true;
            startTime = null;
            updateUI();
            animationFrameId = requestAnimationFrame(animate);
        }

        function determineWinner() {
            var group = groupMapping[currentSpinner];
            matches[group].push([currentSpinner, selectedWinner]);
            spunTeams.push(currentSpinner);

            var matchText = "Trận đấu thuộc BẢNG " + group;

            setTimeout(function() {
                document.getElementById('matchContextText').innerText = matchText;
                document.getElementById('winnerText').innerHTML = "<span class='modal-team1'>" + currentSpinner + "</span> <span class='modal-vs'>gặp</span> <span>" + selectedWinner + "</span>";
                document.getElementById('resultModal').classList.remove('hidden');
            }, 300);
        }

        function confirmSelection() {
            document.getElementById('resultModal').classList.add('hidden');
            currentSpinner = null;
            selectedWinner = null;
            updateUI();
        }
        
        function resetWheel() {
            if (isSpinning) return;
            matches = { "A": [], "B": [] };
            spunTeams = [];
            initCycles();
            currentAngle = 0;
            currentSpinner = null;
            selectedWinner = null;
            
            document.getElementById('statusText').innerText = "Vui lòng chọn một đội để tìm đối thủ!";
            
            document.getElementById('wheelPointer').style.display = 'block';
            document.getElementById('wheelCenter').style.display = 'block';
            document.querySelector('.wheel-container').style.boxShadow = '0 10px 25px rgba(0, 0, 0, 0.4), inset 0 0 0 10px #facc15';
            document.querySelector('.wheel-container').style.background = '#fff';
            document.getElementById('wheelCanvas').style.opacity = '1';
            
            updateUI();
        }

        function updateUI() {
            try {
                drawWheel(); 
            } catch (error) {
                console.error("Lỗi khi vẽ vòng quay: ", error);
            }

            function renderButtons(groupTeams, containerId) {
                var container = document.getElementById(containerId);
                if (!container) return;
                
                var html = '';
                for (var i = 0; i < groupTeams.length; i++) {
                    var team = groupTeams[i];
                    if (spunTeams.indexOf(team) !== -1) continue;
                    
                    var disabled = isSpinning ? 'disabled' : '';
                    var icon = isSpinning ? '⌛' : '🎯 Quay';
                    html += '<button class="team-btn" onclick="startSpinForTeam(\'' + team + '\')" ' + disabled + '>';
                    html += '<span>' + team + '</span>';
                    html += '<span>' + icon + '</span>';
                    html += '</button>';
                }
                
                if (html === '') {
                    container.innerHTML = '<div class="empty-msg">Bảng này đã quay xong</div>';
                } else {
                    container.innerHTML = html;
                }
            }
            
            renderButtons(groups["A"], 'teamButtonsA');
            renderButtons(groups["B"], 'teamButtonsB');
            
            function renderMatches(groupMatches, containerId) {
                var container = document.getElementById(containerId);
                if (!container) return;
                
                if (groupMatches.length === 0) {
                    container.innerHTML = '<div class="empty-msg">Chưa có trận đấu nào</div>';
                } else {
                    var html = '';
                    for (var i = 0; i < groupMatches.length; i++) {
                        var m = groupMatches[i];
                        html += '<div class="match-card">';
                        html += '<span class="match-label">Trận ' + (i + 1) + ':</span> ';
                        html += '<span class="match-team">' + m[0] + '</span> ';
                        html += '<span class="match-vs">VS</span> ';
                        html += '<span class="match-team">' + m[1] + '</span>';
                        html += '</div>';
                    }
                    container.innerHTML = html;
                }
            }

            renderMatches(matches["A"], 'scheduleA');
            renderMatches(matches["B"], 'scheduleB');

            var isCompleteA = matches["A"].length === 3;
            var isCompleteB = matches["B"].length === 3;
            var statusText = document.getElementById('statusText');

            if (isCompleteA && isCompleteB) {
                statusText.innerHTML = "🎉 <b style='color:#fde047; font-size: 1.3rem'>ĐÃ HOÀN TẤT BỐC THĂM</b> 🎉";
                
                document.getElementById('wheelPointer').style.display = 'none';
                document.getElementById('wheelCenter').style.display = 'none';
                document.querySelector('.wheel-container').style.boxShadow = 'none';
                document.querySelector('.wheel-container').style.background = 'transparent';
                document.getElementById('wheelCanvas').style.opacity = '0.3';
            } else if (!isSpinning) {
                statusText.innerText = "Vui lòng chọn một đội để tìm đối thủ!";
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            canvas = document.getElementById('wheelCanvas');
            if (canvas) ctx = canvas.getContext('2d');
            resizeCanvas();
            updateUI();
        });
        
        window.addEventListener('load', function() {
            resizeCanvas();
            updateUI();
        });
    </script>
</body>
</html>
